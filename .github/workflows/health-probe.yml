name: Pulso - panel de salud para iPhone
on:
  workflow_dispatch:
  push:
    paths:
      - 'PruebaSalud-iOS.zip'
      - '.github/workflows/health-probe.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        run: |
          unzip -q PruebaSalud-iOS.zip -d native
          mkdir -p deliverables
          xcodebuild -version
      - name: Compilar para iPhone
        run: |
          set -o pipefail
          xcodebuild -project native/PruebaSalud-iOS/UnRatito.xcodeproj -scheme UnRatito -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Preparar simulador
        run: |
          xcrun simctl list devices available -j > devices.json
          SIM_ID=$(python3 -c 'import json; ds=[d for group in json.load(open("devices.json"))["devices"].values() for d in group if "iPhone 16 Pro" == d["name"]]; print(ds[0]["udid"])')
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
      - name: Tests de datos y catalogo HealthKit
        run: |
          set -o pipefail
          xcodebuild -project native/PruebaSalud-iOS/UnRatito.xcodeproj -scheme UnRatito -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath simbuild -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee tests.log
      - name: Capturas nativas con datos ficticios
        run: |
          xcrun simctl status_bar "$SIM_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$SIM_ID" simbuild/Build/Products/Debug-iphonesimulator/UnRatito.app
          xcrun simctl launch "$SIM_ID" com.si002.pruebasalud --preview-data
          sleep 4
          xcrun simctl io "$SIM_ID" screenshot deliverables/Pulso-resumen-demo.png
          xcrun simctl terminate "$SIM_ID" com.si002.pruebasalud
          xcrun simctl launch "$SIM_ID" com.si002.pruebasalud --preview-data --preview-explore
          sleep 2
          xcrun simctl io "$SIM_ID" screenshot deliverables/Pulso-explorar-demo.png
          xcrun simctl terminate "$SIM_ID" com.si002.pruebasalud
          xcrun simctl launch "$SIM_ID" com.si002.pruebasalud --preview-data --preview-connection
          sleep 2
          xcrun simctl io "$SIM_ID" screenshot deliverables/Pulso-conexion-demo.png
      - name: Crear IPA para iLoader HealthKit
        run: |
          mkdir -p package/Payload
          ditto build/Build/Products/Release-iphoneos/UnRatito.app package/Payload/UnRatito.app
          cd package
          ditto -c -k --keepParent Payload ../deliverables/Pulso-sin-firmar.ipa
          cd ..
          shasum -a 256 deliverables/Pulso-sin-firmar.ipa > deliverables/SHA256.txt
          cp native/PruebaSalud-iOS/EMPIEZA-AQUI.md deliverables/LEEME.md
      - uses: actions/upload-artifact@v4
        with:
          name: Pulso-IPA
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Guardar registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pulso-registros-Xcode
          path: |
            build.log
            tests.log
            TestResults.xcresult
          retention-days: 7
